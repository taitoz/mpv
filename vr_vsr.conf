[vr-vsr]
profile-desc=RTX VSR profile for VR videos
profile-cond=string.find(string.lower(get("filename", "")), "vr") ~= nil or string.find(string.lower(get("filename", "")), "ar") ~= nil
profile-restore=copy
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va

# VSR scale
vf=d3d11vpp=scaling-mode=nvidia:scale=2

# Picture adjustments
brightness=0
contrast=0
saturation=0
gamma=0
hue=0

# Restoration shaders
glsl-shaders-clr
glsl-shaders-append="~~/shaders/nlmeans.glsl"
glsl-shaders-append="~~/shaders/SSim/SSSR+AdaptiveSharpening_Medium_Sharpening.glsl"

# Sync mode for ffmpeg capture
video-sync=audio
