# ========== Shaders ==========

# ----------------- Main Shaders -----------------
#   change-list glsl-shaders toggle ~~/shaders/nlmeans.glsl                                                 #! Shaders > Denoise > Nlmeans
#   set deband no; change-list glsl-shaders pre ~~/shaders/hdeband.glsl                                     #! Shaders > Deband > hdeband
#   change-list glsl-shaders toggle ~~/shaders/adaptive-sharpen.glsl                                        #! Shaders > Sharpen > Adaptive Sharpen
#   change-list glsl-shaders toggle ~~/shaders/SSim/SSimSuperRes.glsl                                       #! Shaders > Sharpen > SSimSuperRes (sharpen + anti-ringing)
#   change-list glsl-shaders toggle ~~/shaders/SSim/SSSR+AdaptiveSharpening_High_Sharpening.glsl            #! Shaders > Sharpen > SSSR+AdaptiveSharpening (High Strength)
#   change-list glsl-shaders toggle ~~/shaders/SSim/SSSR+AdaptiveSharpening_Medium_Sharpening.glsl          #! Shaders > Sharpen > SSSR+AdaptiveSharpening (Medium Strength) (default)
#   change-list glsl-shaders toggle ~~/shaders/SSim/SSSR+AdaptiveSharpening_Low_Sharpening.glsl             #! Shaders > Sharpen > SSSR+AdaptiveSharpening (Low Strength)
# ----------------- ACNet / ARNet (Anime4KCPP v3.1.0) -----------------
# ACNet — Lightweight CNN, all variants at 5k params. Same model as before, faster implementation.
#   Variants differ only in denoise strength; GAN trades denoising for detail enhancement.
#   ★ Recommended: acnet_hdn0 (clean source / BD) · acnet_hdn1 (mildly noisy / old DVD)
#
#   change-list glsl-shaders toggle ~~/shaders/ACNet/acnet_gan.glsl                                         #! Shaders > Luma Upscaler > ACNet > GAN (5k — detail enhancement, no denoise)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/acnet_hdn0.glsl                                        #! Shaders > Luma Upscaler > ACNet > HDN0 ★ (5k — mild denoise)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/acnet_hdn1.glsl                                        #! Shaders > Luma Upscaler > ACNet > HDN1 (5k — moderate denoise)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/acnet_hdn2.glsl                                        #! Shaders > Luma Upscaler > ACNet > HDN2 (5k — heavy denoise)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/acnet_hdn3.glsl                                        #! Shaders > Luma Upscaler > ACNet > HDN3 (5k — extreme denoise)
#
# ARNet — Lightweight ResNet, 7 sizes (B4→B64). Larger = more params = better quality, slower.
#   HDN variant: mild denoise — lighter even than ACNet HDN0. Preserves the original look. Safe default.
#   LE  variant: line enhancing — sharpens line art but may alter the visual style of soft sources.
#   ★ Recommended: arnet_b16_hdn (19k — best speed/quality balance, developer suggestion)
#                  arnet_b16_le  (19k — same but for crisp line-art anime)
#
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b4_hdn.glsl                                      #! Shaders > Luma Upscaler > ARNet > B4 HDN (5k — fastest, lowest quality)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b4_le.glsl                                       #! Shaders > Luma Upscaler > ARNet > B4 LE (5k — fastest, lowest quality, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b8_hdn.glsl                                      #! Shaders > Luma Upscaler > ARNet > B8 HDN (10k)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b8_le.glsl                                       #! Shaders > Luma Upscaler > ARNet > B8 LE (10k, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b16_hdn.glsl                                     #! Shaders > Luma Upscaler > ARNet > B16 HDN ★ (19k — recommended balance)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b16_le.glsl                                      #! Shaders > Luma Upscaler > ARNet > B16 LE ★ (19k — recommended balance, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b24_hdn.glsl                                     #! Shaders > Luma Upscaler > ARNet > B24 HDN (28k)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b24_le.glsl                                      #! Shaders > Luma Upscaler > ARNet > B24 LE (28k, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b32_hdn.glsl                                     #! Shaders > Luma Upscaler > ARNet > B32 HDN (37k)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b32_le.glsl                                      #! Shaders > Luma Upscaler > ARNet > B32 LE (37k, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b48_hdn.glsl                                     #! Shaders > Luma Upscaler > ARNet > B48 HDN (55k)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b48_le.glsl                                      #! Shaders > Luma Upscaler > ARNet > B48 LE (55k, Line Art)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b64_hdn.glsl                                     #! Shaders > Luma Upscaler > ARNet > B64 HDN (74k — slowest, highest quality)
#   change-list glsl-shaders toggle ~~/shaders/ACNet/arnet_b64_le.glsl                                      #! Shaders > Luma Upscaler > ARNet > B64 LE (74k — slowest, highest quality, Line Art)
# ----------------- Downscalers -----------------
#   set linear-downscaling no; change-list glsl-shaders toggle ~~/shaders/SSim/SSimDownscaler.glsl          #! Shaders > Downscaler > SSimDownscaler

