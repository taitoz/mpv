[vr_rst]
profile-desc=VR Low-bitrate Restoration & Smart Sharpening
profile-cond=string.find(string.lower(get("filename", "")), "vr") ~= nil or string.find(string.lower(get("filename", "")), "ar") ~= nil
profile-restore=copy
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va

# Picture adjustments
brightness=0
contrast=0
saturation=0
gamma=0
hue=3

# Upscaling with reduced ringing (halos) around edges
scale=ewa_lanczos
scale-antiring=0.3
cscale=ewa_lanczos
cscale-antiring=0.3
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no

# Debanding of flat low-bitrate gradients
deband=yes
deband-iterations=3
deband-threshold=32
deband-range=16
deband-grain=16

# Restoration shaders
glsl-shaders-clr
# 1. Neural luma upscaling (adds detail and cleans compression artifacts)
glsl-shaders-append="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhance.glsl"
# 2. Noise and compression artifact removal
glsl-shaders-append="~~/shaders/nlmeans.glsl"
# 3. Gentle super-resolution sharpening for fine detail
glsl-shaders-append="~~/shaders/SSim/SSSR+AdaptiveSharpening_Low_Sharpening.glsl"
# 4. High-quality downscaling to the output size
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

# Sync mode for ffmpeg capture
video-sync=audio