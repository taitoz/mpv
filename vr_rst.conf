[vr_rst]
profile-desc=VR Low-bitrate Restoration & Smart Sharpening
profile-cond=string.find(string.lower(get("filename", "")), "vr") ~= nil or string.find(string.lower(get("filename", "")), "ar") ~= nil
profile-restore=copy
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va

# Настройки изображения
brightness=0
contrast=0
saturation=0
gamma=0
hue=3

# Жесткое подавление ringing (звона) на контурах
scale=ewa_lanczos
scale-antiring=0.3
cscale=ewa_lanczos
cscale-antiring=0.3
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no

# Убираем градиентные полосы от низкого битрейта
deband=yes
deband-iterations=3
deband-threshold=32
deband-range=16
deband-grain=16

# Шейдерная обработка
glsl-shaders-clr
# 1. Нейросетевой апскейлер (убирает пикселизацию и строит чистые контуры без звона)
glsl-shaders-append="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhance.glsl"
# 2. Шум и артефакты сжатия
glsl-shaders-append="~~/shaders/nlmeans.glsl"
# 3. Умная микро-детализация без усиления ореолов
glsl-shaders-append="~~/shaders/SSim/SSSR+AdaptiveSharpening_Low_Sharpening.glsl"
# 4. Финальное сжатие с правильным анти-рингингом
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

# Синхронизация для захвата ffmpeg
video-sync=audio