[1440p+]
profile-desc=1440p / 4K class sources (short side >= 1440)
profile-cond=get("user-data/vr-profile", "") == "none" and not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) >= 1440
profile=HighQuality
glsl-shaders-clr
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

[hd]
profile-desc=720p / 1080p class sources
profile-cond=get("user-data/vr-profile", "") == "none" and not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) >= 720 and math.min(get("dwidth", 0), get("dheight", 0)) < 1440
profile=HighQuality
glsl-shaders-clr
# Luma x2 prescaler; its WHEN runs it only above 1.4x (e.g. 720p on a 1080p screen), idle at 1:1.
glsl-shaders-append="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhance.glsl"
glsl-shaders-append="~~/shaders/SSim/SSSR+AdaptiveSharpening_Medium_Sharpening.glsl"
glsl-shaders-append="~~/shaders/Chroma/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/SSim/SSimDownscaler.glsl"

[sdtv-ntsc]
profile-desc=SD sources
profile-cond=get("user-data/vr-profile", "") == "none" and not get("current-tracks/video/albumart", false) and math.min(get("dwidth", 0), get("dheight", 0)) > 0 and math.min(get("dwidth", 0), get("dheight", 0)) < 720
profile=HighQuality
glsl-shaders-clr
glsl-shaders-append="~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1_enhance.glsl"
glsl-shaders-append="~~/shaders/Chroma/CfL_Prediction.glsl"

[audio]
profile-desc=Audio files and cover art, never treated as video
profile-cond=get("current-tracks/video/albumart", false) or (get("current-tracks/audio/id", 0) > 0 and get("current-tracks/video/id", 0) == 0)
glsl-shaders-clr

[HighQuality]
profile-desc=Shared scaling and HDR settings
scale=spline36
scale-antiring=0.2
cscale=lanczos
dscale=mitchell
linear-downscaling=no
correct-downscaling=yes
sigmoid-upscaling=yes
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
allow-delayed-peak-detect=no

[Fast]
profile-desc=Cheap render path, no shaders
glsl-shaders-clr
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
deband=no
dither=no
interpolation=no
hdr-compute-peak=no
hdr-peak-percentile=100
hdr-contrast-recovery=0.0
allow-delayed-peak-detect=yes


# =============================================================================
# VIDEO - misc behaviour
# =============================================================================

[interpolation-activate]
profile-desc=Turn on display resampling whenever interpolation is enabled
profile-restore=copy
profile-cond=get("interpolation", false)
video-sync=display-resample

[gif]
profile-desc=Short looping clips (gif / webp / apng)
profile-restore=copy
profile-cond=get("filename", ""):lower():find("%.gif$") or get("filename", ""):lower():find("%.webp$") or get("filename", ""):lower():find("%.apng$")
loop-file=inf
cache=no

[pip]
profile-desc=Small always on top window in the corner
ontop=yes
on-all-workspaces=yes
force-window-position=no
geometry=100%:100%
autofit=30%x30%

[pip-off]
profile-desc=Undo [pip], back to the mpv.conf default window size
ontop=no
on-all-workspaces=no
force-window-position=no
geometry=50%:50%
autofit=75%x75%

# =============================================================================
# AUDIO - automatic downmix to stereo
# =============================================================================

[Downmix_Audio_5_1]
profile-desc=5.1 to stereo, dialogue lift and LFE lowpass
profile-cond=get("audio-params/channel-count", 0) == 6
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.707*FL+0.707*BL+0.5*LFE|FR=0.5*FC+0.707*FR+0.707*BR+0.5*LFE"

[Downmix_Audio_7_1]
profile-desc=7.1 to stereo, dialogue lift and LFE lowpass
profile-cond=get("audio-params/channel-count", 0) == 8
af=lavfi="lowpass=c=LFE:f=120,volume=1.6,pan=stereo|FL=0.5*FC+0.3*FLC+0.3*FL+0.3*BL+0.3*SL+0.5*LFE|FR=0.5*FC+0.3*FRC+0.3*FR+0.3*BR+0.3*SR+0.5*LFE"

[Downmix_Audio_Other]
profile-desc=Any other multichannel layout to stereo
profile-cond=get("audio-params/channel-count", 0) > 2 and get("audio-params/channel-count", 0) ~= 6 and get("audio-params/channel-count", 0) ~= 8
af=lavfi="aformat=channel_layouts=stereo"

[Downmix_Audio_Stereo]
profile-desc=Mono / stereo sources, no filter
profile-cond=get("audio-params/channel-count", 0) > 0 and get("audio-params/channel-count", 0) <= 2
af-clr