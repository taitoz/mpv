# ===================================================================
# Profiles and Advanced Settings
# ===================================================================
include="~~/profiles.conf"
include="~~/vr_profiles.conf"

#include="~~/vr_rst.conf"
#mpv --profile=vr_rst "X:\Path\To\Video.mp4"

# ===================================================================
# General
# ===================================================================
autofit=75%x75%
keep-open=yes
force-seekable=yes
watch-later-options=start,sid
quiet
msg-color=yes
msg-module=yes
term-osd-bar=yes
image-display-duration=inf
hr-seek=yes
input-default-bindings=no
audio-file-auto=fuzzy
sub-auto=fuzzy
reset-on-next-file=pause
autocreate-playlist=filter

# ===================================================================
# Video & Performance (GPU rendering and hardware decoding)
# ===================================================================
vo=gpu-next
gpu-api=vulkan
hwdec=vulkan

# Display: Philips 278G4 — 1080p60 AH-IPS, 6-bit + FRC, sRGB, HDMI.
# NVIDIA: RGB, 8 bpc, Full range. mpv renders to an 8-bit swapchain, so dither
# to the swapchain depth; dithering to 12 bits would only be truncated.
dither-depth=auto
dither-size-fruit=6
dither=fruit
# The panel's FRC is already temporal dithering; avoid stacking a second one.
temporal-dither=no
video-output-levels=full
# sRGB-gamut monitor: gamut-map wide-gamut/HDR sources to BT.709.
# target-trc stays auto: forcing srgb lifts shadows of BT.1886-mastered video.
target-prim=bt.709

deinterlace=no
tone-mapping=bt.2446a
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
vd-lavc-dr=yes

# ===================================================================
# Cache & Streaming
# ===================================================================
cache=auto
demuxer-readahead-secs=120
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=250MiB
cache-pause=no

ytdl-format=bestvideo[height<=?1080]+bestaudio/best[height<=?1080]
ytdl-raw-options=sub-lang="vi.*,en.*"
hls-bitrate=max
load-unsafe-playlists=yes

# ===================================================================
# UI & OSD
# ===================================================================
osc=no
osd-bar=no
border=no
cursor-autohide-fs-only=yes
cursor-autohide=100
osd-level=1

osd-font="Berkeley Mono"
osd-font-size=36
osd-bold=yes
osd-duration=1000
osd-shadow-offset=0.75
osd-outline-size=1.5

# ===================================================================
# Audio
# ===================================================================
# Explicitly select the WASAPI audio output
#audio-device=wasapi
# Exclusive mode: bypass the Windows mixer (ASIO-like behaviour)
#audio-exclusive=yes

# Downmix any multichannel audio to stereo
audio-channels=stereo

# Start at 0 volume and allow boosting above 100% up to volume-max
volume=0
volume-max=150

# Soft compressor + limiter: evens out loudness, keeps peaks below 0 dB
af=lavfi="acompressor=threshold=-6dB:ratio=9:attack=5:release=50,alimiter=limit=0.95"

audio-pitch-correction=yes

# ===================================================================
# Subtitles
# ===================================================================
track-auto-selection=yes
alang=jp,jpn,en,eng
slang=en,eng,jp,jpn,und
demuxer-mkv-subtitle-preroll=yes
sub-fix-timing=no
sub-file-paths=ass;srt;sub;subs;subtitles;Subs

sub-font="Netflix Sans Med"
sub-font-size=35
sub-color='#FFFFFFFF'
sub-outline-color="#FF000000"
sub-outline-size=2.0
sub-back-color=0.0/0.0/0.0/0.70
sub-shadow-offset=0.75
sub-spacing=1.0
sub-bold=yes
sub-blur=0.3
sub-use-margins=no
embeddedfonts=yes
sub-ass-scale-with-window=no
sub-gray

# ===================================================================
# Debanding & Interpolation
# ===================================================================
deband=no
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48

# Smooth 24/25/30p on the 60 Hz display; VR profiles inherit this.
interpolation=yes
video-sync=display-resample
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.05
tscale-clamp=0.0

# ===================================================================
# Screenshot
# ===================================================================
screenshot-format=png
screenshot-webp-lossless=yes
screenshot-dir="~/Downloads"