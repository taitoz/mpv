# ===================================================================
# VR/AR PREVIEW & VSR PROFILES (Full Collection)
# ===================================================================

# --- FISHEYE 200 (��������, MKX200) ---
[vr-preview-fisheye200]
profile-cond=get("user-data/vr-profile", "") == "fisheye200"
profile-restore=copy
vo=gpu-next
gpu-api=d3d11
hwdec=d3d11va
vf-clr
glsl-shaders="~~/shaders/vr-flat.glsl"
glsl-shader-opts=vr_projection=2,vr_stereo_tb=0,vr_input_fov=200,vr_hfov=100,vr_vfov=60
video-aspect-override=2.064178
video-sync=audio

